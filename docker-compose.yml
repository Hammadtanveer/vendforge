services:
  db:
    image: postgres:16-alpine
    container_name: vendforge-db
    environment:
      POSTGRES_USER: vendforge
      POSTGRES_PASSWORD: vendforge_secret
      POSTGRES_DB: vendforge
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendforge -d vendforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vendforge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://vendforge:vendforge_secret@db:5432/vendforge
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
